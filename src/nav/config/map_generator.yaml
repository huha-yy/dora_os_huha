# Map Generator Configuration
# Parameters for real-time map generation from RealSense camera

map_generator:
  ros__parameters:
    # Map dimensions and resolution
    map_resolution: 0.05      # meters per pixel (5cm)
    map_width: 10.0           # meters (total width)
    map_height: 10.0          # meters (total depth)
    
    # Obstacle detection height range
    min_obstacle_height: 0.1  # meters (detect obstacles above this height)
    max_obstacle_height: 2.0  # meters (detect obstacles below this height)
    
    # Depth sensor range
    depth_max_range: 5.0      # meters (maximum depth to consider)
    depth_min_range: 0.3      # meters (minimum depth to consider)
    
    # Update frequency
    update_rate: 2.0          # Hz (map update frequency)
    
    # Occupancy thresholds
    occupancy_threshold: 0.65 # Probability threshold for occupied cell
    free_threshold: 0.35      # Probability threshold for free cell
    
    # Topic names
    rgb_topic: '/camera/camera/color/image_raw'
    depth_topic: '/camera/camera/aligned_depth_to_color/image_raw'
    camera_info_topic: '/camera/camera/color/camera_info'
    
    # Visualization
    enable_visualization: true
