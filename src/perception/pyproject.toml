[project]
name = "daneenon-body-tracking"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mediapipe==0.10.18",
    "moviepy>=2.1.2",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "ultralytics==8.3.245",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "scipy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
