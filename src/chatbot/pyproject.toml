[project]
name = "chatbot"
version = "0.1.0"
description = "A WebSocket-based chatbot server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru==0.7.3",
    "uvicorn==0.40.0",
    "click==8.3.1",
    "numpy==1.26.4",
    "openai>=1.54.0,<2.0",
    "fastapi==0.128.0",
    "python-multipart==0.0.22",
    "edge-tts==7.2.7",
    "sherpa-onnx==1.12.23",
    "onnxruntime==1.23.2",
    "requests==2.32.5",
    "tqdm==4.67.2",
    "websockets==16.0",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "async-timeout==5.0.1",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "coloredlogs==15.0.1",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.3.3",
    "exceptiongroup==1.3.1",
    "filelock==3.20.3",
    "flatbuffers==25.12.19",
    "frozenlist==1.8.0",
    "fsspec==2026.1.0",
    "h11==0.16.0",
    "humanfriendly==10.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "multidict==6.7.1",
    "networkx==3.4.2",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.5",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.8.90",
    "packaging==26.0",
    "propcache==0.4.1",
    "protobuf==6.33.5",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "sherpa-onnx-core==1.12.23",
    "silero-vad==6.2.0",
    "starlette==0.50.0",
    "sympy==1.14.0",
    "tabulate==0.9.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "triton==3.6.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "yarl==1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
