[project]
name = "chatbot"
version = "0.1.0"
description = "A WebSocket-based chatbot server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
    "uvicorn>=0.30.0",
    "click>=8.1.0",
    "numpy>=1.24,<2.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1.0",
    "sherpa-onnx>=1.10.0",
    "onnxruntime>=1.18.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
