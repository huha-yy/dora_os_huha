<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header id="standalone-header">
            <h1>Chatbot Demo</h1>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </header>

        <main>
            <div class="chat-container" id="chat-container">
                <div class="messages" id="messages"></div>
            </div>

            <div class="debug-panel" id="debug-panel" hidden>
                <div class="debug-log" id="debug-log"></div>
                <button id="clear-debug" class="btn btn-small">Clear Log</button>
            </div>

            <div class="input-area">
                <div class="input-row">
                    <input
                        type="text"
                        id="text-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >
                    <button id="send-btn" class="btn btn-primary">Send</button>
                </div>
                <div class="toolbar" id="toolbar">
                    <button id="mic-btn" class="btn btn-toolbar mic-muted" title="Toggle microphone">
                        <span class="mic-icon">🎤</span>
                        <span class="mic-text">Connecting...</span>
                    </button>
                    <button id="interrupt-btn" class="btn btn-danger btn-toolbar" title="Interrupt speech">Interrupt</button>
                    <button id="debug-toggle-btn" class="btn btn-secondary btn-toolbar" title="Show debug log">Debug</button>
                </div>
            </div>
        </main>

        <audio id="audio-player" style="display: none;"></audio>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
