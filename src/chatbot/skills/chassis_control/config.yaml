# =============================================================================
# 底盘语音控制 - 动作配置
# type: chassis_move = 短暂移动后自动停止
# =============================================================================

actions:
  - name: "前进"
    keywords:
      - 前进
      - 往前走
      - 向前走
      - 直走
      - 往前去
      - 向前移动
      - 开过去
      - 朝前走
      - 向前行驶
      - 往前开
    type: chassis_move
    linear_x: 0.3
    linear_y: 0.0
    angular_z: 0.0
    duration_sec: 2.0

  - name: "后退"
    keywords:
      - 后退
      - 往后退
      - 向后走
      - 倒车
      - 倒退
      - 往后去
      - 退回去
      - 往回走
      - 朝后走
    type: chassis_move
    linear_x: -0.3
    linear_y: 0.0
    angular_z: 0.0
    duration_sec: 2.0

  - name: "左转"
    keywords:
      - 左转
      - 向左转
      - 往左拐
      - 左转弯
      - 朝左转
      - 转左边
    type: chassis_move
    linear_x: 0.0
    linear_y: 0.0
    angular_z: 0.5
    duration_sec: 2.0

  - name: "右转"
    keywords:
      - 右转
      - 向右转
      - 往右拐
      - 右转弯
      - 朝右转
      - 转右边
    type: chassis_move
    linear_x: 0.0
    linear_y: 0.0
    angular_z: -0.5
    duration_sec: 2.0

  - name: "停止"
    keywords:
      - 停下
      - 停止
      - 别动
      - 刹车
      - 停住
      - 站住
      - 别走了
      - 停下来
    type: chassis_move
    linear_x: 0.0
    linear_y: 0.0
    angular_z: 0.0
    duration_sec: 0.0
