<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tool - ASR & TTS Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 30px; text-align: center; }
        h2 { margin: 30px 0 15px; color: #4a90d9; }
        
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        input, textarea, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        
        input, textarea {
            background: rgba(255,255,255,0.1);
            color: #eee;
        }
        
        button {
            background: #4a90d9;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover { background: #3a7fc9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.recording { background: #dc3545; }
        
        .result {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 50px;
            font-family: monospace;
        }
        
        audio { width: 100%; margin-top: 10px; }
        
        .status {
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .status.connected { background: #28a745; }
        .status.disconnected { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web Tool</h1>

        <!-- ASR Section -->
        <div class="card">
            <h2>ASR (Speech-to-Text)</h2>
            <p style="color: #aaa; margin-bottom: 15px;">Record audio and transcribe to text using the /asr endpoint.</p>
            
            <button id="asr-record-btn">🎤 Hold to Record</button>
            <div class="result" id="asr-result">Transcription will appear here...</div>
        </div>

        <!-- TTS Section -->
        <div class="card">
            <h2>TTS (Text-to-Speech)</h2>
            <p style="color: #aaa; margin-bottom: 15px;">Enter text to synthesize speech using the /tts-ws endpoint.</p>
            
            <div class="status disconnected" id="tts-status">TTS Disconnected</div>
            <button id="tts-connect-btn">Connect to TTS</button>
            
            <textarea id="tts-input" rows="3" placeholder="Enter text to speak..."></textarea>
            <button id="tts-speak-btn" disabled>Speak</button>
            
            <div class="result" id="tts-result">Status will appear here...</div>
            <audio id="tts-audio" controls style="display: none;"></audio>
        </div>
    </div>

    <script>
        // ==================== ASR ====================
        const asrBtn = document.getElementById('asr-record-btn');
        const asrResult = document.getElementById('asr-result');
        let mediaRecorder = null;
        let audioChunks = [];

        asrBtn.addEventListener('mousedown', startAsrRecording);
        asrBtn.addEventListener('mouseup', stopAsrRecording);
        asrBtn.addEventListener('mouseleave', () => {
            if (mediaRecorder?.state === 'recording') stopAsrRecording();
        });

        async function startAsrRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    sendToAsr();
                };

                mediaRecorder.start();
                asrBtn.textContent = '🔴 Recording...';
                asrBtn.classList.add('recording');
            } catch (err) {
                asrResult.textContent = 'Error: ' + err.message;
            }
        }

        function stopAsrRecording() {
            if (mediaRecorder?.state === 'recording') {
                mediaRecorder.stop();
                asrBtn.textContent = '🎤 Hold to Record';
                asrBtn.classList.remove('recording');
            }
        }

        async function sendToAsr() {
            asrResult.textContent = 'Transcribing...';
            
            try {
                // Convert webm to wav
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.wav');

                const response = await fetch('/asr', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                asrResult.textContent = data.text || data.error || 'No response';
            } catch (err) {
                asrResult.textContent = 'Error: ' + err.message;
            }
        }

        // ==================== TTS ====================
        const ttsConnectBtn = document.getElementById('tts-connect-btn');
        const ttsSpeakBtn = document.getElementById('tts-speak-btn');
        const ttsInput = document.getElementById('tts-input');
        const ttsResult = document.getElementById('tts-result');
        const ttsAudio = document.getElementById('tts-audio');
        const ttsStatus = document.getElementById('tts-status');
        let ttsWs = null;

        ttsConnectBtn.addEventListener('click', connectTts);
        ttsSpeakBtn.addEventListener('click', speakTts);

        function connectTts() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ttsWs = new WebSocket(`${protocol}//${location.host}/tts-ws`);

            ttsWs.onopen = () => {
                ttsStatus.textContent = 'TTS Connected';
                ttsStatus.className = 'status connected';
                ttsConnectBtn.textContent = 'Disconnect';
                ttsSpeakBtn.disabled = false;
                ttsResult.textContent = 'Ready to speak...';
            };

            ttsWs.onclose = () => {
                ttsStatus.textContent = 'TTS Disconnected';
                ttsStatus.className = 'status disconnected';
                ttsConnectBtn.textContent = 'Connect to TTS';
                ttsSpeakBtn.disabled = true;
            };

            ttsWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.status === 'partial') {
                    ttsResult.textContent = `Playing: ${data.text}`;
                    ttsAudio.src = '/' + data.audioPath;
                    ttsAudio.style.display = 'block';
                    ttsAudio.play();
                } else if (data.status === 'complete') {
                    ttsResult.textContent = 'Playback complete';
                } else if (data.status === 'error') {
                    ttsResult.textContent = 'Error: ' + data.message;
                }
            };

            ttsWs.onerror = () => {
                ttsResult.textContent = 'WebSocket error';
            };
        }

        function speakTts() {
            const text = ttsInput.value.trim();
            if (!text || !ttsWs) return;

            ttsWs.send(JSON.stringify({ text }));
            ttsResult.textContent = 'Generating audio...';
        }
    </script>
</body>
</html>
