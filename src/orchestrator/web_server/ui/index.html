<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dorabot — Live Monitor</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2330;
      --border: #2b3340;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --ok: #2ea043;
      --warn: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), #1f6feb);
    }
    .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
    .badges { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px; font-size: 12.5px; color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .dot.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    main {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 10px;
      padding: 10px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel .head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--muted); flex: 0 0 auto;
    }
    .panel .head .title { color: var(--text); font-weight: 600; }

    .video-wrap {
      flex: 1 1 auto; position: relative;
      background: #000; display: flex; align-items: center; justify-content: center;
      min-height: 0;
    }
    .video-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .video-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 10px; background: rgba(0,0,0,.6); color: var(--muted); font-size: 14px;
    }
    .video-overlay.show { display: flex; }
    .spinner {
      width: 30px; height: 30px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sidebar {
      padding: 0;
      background: var(--bg);
      border: none;
    }
    .sidebar iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      min-height: 0;
      display: block;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"></div>
      <h1>Dorabot — Live Monitor</h1>
    </div>
    <div class="badges">
      <span class="badge"><span class="dot" id="cam-dot"></span><span id="cam-text">Camera</span></span>
      <span class="badge"><span class="dot" id="bot-dot"></span><span id="bot-text">Chatbot</span></span>
      <span class="badge" id="fall-badge"><span class="dot ok" id="fall-dot"></span><span id="fall-text">No fall</span></span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="head">
        <span class="title">Human Tracking &amp; Fall Detection</span>
        <span id="cam-meta">—</span>
      </div>
      <div class="video-wrap">
        <img id="video" alt="camera stream" />
        <div class="video-overlay" id="video-overlay">
          <div class="spinner"></div>
          <div id="overlay-text">Waiting for camera…</div>
        </div>
      </div>
    </section>

    <section class="panel sidebar">
      <iframe id="chatbot" allow="microphone; autoplay" referrerpolicy="no-referrer" title="Chatbot"></iframe>
    </section>
  </main>

  <script>
    const CHATBOT_PORT = 8000;
    const host = window.location.hostname || "localhost";
    const proto = window.location.protocol === "https:" ? "https:" : "http:";

    const chatbotUrl = `${proto}//${host}:${CHATBOT_PORT}/?embed=1`;
    const iframe = document.getElementById("chatbot");
    iframe.src = chatbotUrl;

    const video = document.getElementById("video");
    const overlay = document.getElementById("video-overlay");
    const overlayText = document.getElementById("overlay-text");
    function startVideo() {
      video.src = `/video/stream?ts=${Date.now()}`;
    }
    video.onerror = () => {
      overlay.classList.add("show");
      overlayText.textContent = "Camera stream unavailable — retrying…";
      setTimeout(startVideo, 2000);
    };
    startVideo();

    const camDot = document.getElementById("cam-dot");
    const camText = document.getElementById("cam-text");
    const camMeta = document.getElementById("cam-meta");
    const botDot = document.getElementById("bot-dot");
    const botText = document.getElementById("bot-text");

    let chatbotWsConnected = false;
    let chatbotServerUp = false;

    function setChatbotStatus() {
      if (chatbotWsConnected) {
        botDot.className = "dot ok";
        botText.textContent = "Chatbot connected";
      } else if (chatbotServerUp) {
        botDot.className = "dot warn";
        botText.textContent = "Chatbot connecting…";
      } else {
        botDot.className = "dot danger";
        botText.textContent = "Chatbot offline";
      }
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.source !== "dorabot-chatbot" || data.type !== "connection") {
        return;
      }
      chatbotWsConnected = !!data.connected;
      setChatbotStatus();
    });

    function updateVideoMeta() {
      const nw = video.naturalWidth || 0;
      const nh = video.naturalHeight || 0;
      const cw = video.clientWidth || 0;
      const ch = video.clientHeight || 0;
      if (nw > 0 && nh > 0) {
        camMeta.textContent = `${nw}×${nh} → ${cw}×${ch}px`;
      }
    }
    video.onload = updateVideoMeta;
    window.addEventListener("resize", updateVideoMeta);

    async function pollVideoStatus() {
      try {
        const r = await fetch("/video/status", { cache: "no-store" });
        const s = await r.json();
        const age = s.age_seconds;
        if (s.has_frame && age != null && age < 3) {
          camDot.className = "dot ok";
          camText.textContent = "Camera live";
          camMeta.textContent = age != null ? `${age.toFixed(1)}s ago` : "—";
          overlay.classList.remove("show");
        } else {
          camDot.className = "dot warn";
          camText.textContent = "Camera idle";
          camMeta.textContent = s.has_frame && age != null
            ? `${age.toFixed(0)}s stale`
            : "no frames";
          overlay.classList.add("show");
          overlayText.textContent = "Waiting for camera…";
        }
      } catch (e) {
        camDot.className = "dot danger";
        camText.textContent = "Orchestrator down";
      }
    }

    async function pollChatbotServer() {
      try {
        await fetch(`${proto}//${host}:${CHATBOT_PORT}/`, { mode: "no-cors", cache: "no-store" });
        chatbotServerUp = true;
      } catch (e) {
        chatbotServerUp = false;
        chatbotWsConnected = false;
      }
      setChatbotStatus();
    }

    setInterval(pollVideoStatus, 1500);
    setInterval(pollChatbotServer, 4000);
    pollVideoStatus();
    pollChatbotServer();
    setChatbotStatus();
  </script>
</body>
</html>
