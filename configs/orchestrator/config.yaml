# Default Orchestrator Configuration
# Basic mode with core services only

# Core settings
language: "zh"  # Language for AI agent (zh or en)
orchestrator_port: 8080  # UI + MJPEG + events API (chatbot uses 8000 separately)

# Note: Virtual environment should be activated in bash scripts before running
# Example: source ~/dorabot_ws/.venv/bin/activate

# Service control
services:
  # Core services (always recommended)
  ai_agent: true
  realsense_camera: true
  perception: true
  
  # Navigation services
  map_generator: false
  map_manager: false
  rtabmap_slam: false
  nav2_navigation: false

# Service-specific settings
perception:
  debug_video_path: null  # Path to debug video file (null for real camera)
  print_fps: true
  process_every_n: 2  # Run YOLO + pose every 2nd frame; skipped frames reuse last overlay
  detection_model_name: yolo11n_rknn_model  # NPU (RK3588); use yolov8n.pt for CPU fallback

camera:
  # Depth off while mapping/SLAM are disabled; set true (or enable map services) later.
  align_depth: false
  # Robot display is 1024×600; video panel renders ~588×441 — 424×240 is enough.
  width: 424
  height: 240
  fps: 15
  # D415 is mounted upside down on this robot — flip images and publish mount TF.
  flip_180: true
  mount_tf_parent: base_link
  mount_tf_child: camera_link
  # static_transform_publisher: x y z yaw pitch roll (radians)
  mount_tf_yaw: 3.14159
  mount_tf_pitch: 0.0
  mount_tf_roll: 0.0
  
mapping:
  config_file: "configs/nav/map_generator.yaml"
  
map_manager:
  config_file: "configs/nav/map_manager.yaml"

rtabmap:
  rgb_topic: "/camera/camera/color/image_raw"
  depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  camera_info_topic: "/camera/camera/color/camera_info"
  approx_sync: true
  frame_id: "camera_link"
