# Orchestrator Configuration - Full Navigation Suite
# All navigation features enabled

language: "zh"
orchestrator_port: 8000

services:
  # Core services
  ai_agent: true
  realsense_camera: true
  perception: true
  
  # Navigation services
  map_generator: true
  map_manager: true
  rtabmap_slam: true
  nav2_navigation: true  # Full Nav2 stack

perception:
  debug_video_path: null
  print_fps: false

camera:
  align_depth: true
  
mapping:
  config_file: "configs/nav/map_generator.yaml"
  
map_manager:
  config_file: "configs/nav/map_manager.yaml"

rtabmap:
  rgb_topic: "/camera/camera/color/image_raw"
  depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  camera_info_topic: "/camera/camera/color/camera_info"
  approx_sync: true
  frame_id: "camera_link"
