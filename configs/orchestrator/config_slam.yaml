# Orchestrator Configuration - With SLAM
# Enables RTAB-Map SLAM for robust mapping and localization

language: "zh"
orchestrator_port: 8000

services:
  # Core services
  ai_agent: true
  realsense_camera: true
  perception: true
  
  # Navigation services
  map_generator: true   # Custom mapping
  map_manager: true     # Map persistence
  rtabmap_slam: true    # RTAB-Map SLAM
  nav2_navigation: false

perception:
  debug_video_path: null
  print_fps: false

camera:
  align_depth: true
  
mapping:
  config_file: "configs/nav/map_generator.yaml"
  
map_manager:
  config_file: "configs/nav/map_manager.yaml"

rtabmap:
  rgb_topic: "/camera/camera/color/image_raw"
  depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  camera_info_topic: "/camera/camera/color/camera_info"
  approx_sync: true
  frame_id: "camera_link"
