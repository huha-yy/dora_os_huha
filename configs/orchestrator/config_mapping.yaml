# Orchestrator Configuration - With Mapping
# Enables custom map generation and management

language: "zh"
orchestrator_port: 8080

services:
  # Core services
  ai_agent: false       # Disable - not needed for mapping
  realsense_camera: true
  perception: false     # Disable - has a bug causing crashes
  
  # Navigation services
  map_generator: true   # Enable custom map generation
  map_manager: true     # Enable map persistence
  rtabmap_slam: false
  nav2_navigation: false

perception:
  debug_video_path: null
  print_fps: false

camera:
  align_depth: true
  flip_180: true
  mount_tf_parent: base_link
  mount_tf_child: camera_link
  mount_tf_yaw: 3.14159
  mount_tf_pitch: 0.0
  mount_tf_roll: 0.0
  
mapping:
  config_file: "configs/nav/map_generator.yaml"
  
map_manager:
  config_file: "configs/nav/map_manager.yaml"
